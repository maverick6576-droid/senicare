name: Build & Publish iOS Release (TestFlight)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Validate Stripe Publishable Key on Release Tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          STRIPE_PK: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          if [[ "$STRIPE_PK" != pk_live_* ]]; then
            echo "::error::Production tag build requires a live Stripe publishable key (pk_live_*)."
            exit 1
          fi

      - name: Inject GoogleService-Info.plist & Configure Google Sign-In Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        if: env.GOOGLE_SERVICE_INFO_PLIST_BASE64 != ''
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :CLIENT_ID" ios/Runner/GoogleService-Info.plist)
          REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/Runner/GoogleService-Info.plist)
          /usr/libexec/PlistBuddy -c "Set :GIDClientID $CLIENT_ID" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:1:CFBundleURLSchemes:0 $REVERSED_CLIENT_ID" ios/Runner/Info.plist

      - name: Install Apple Distribution Certificate & Provisioning Profile
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        if: env.IOS_DIST_CERT_BASE64 != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != ''
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASS=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          echo "$IOS_DIST_CERT_BASE64" | tr -d '\r\n ' | base64 -D > $RUNNER_TEMP/dist.p12
          security import $RUNNER_TEMP/dist.p12 -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d '\r\n ' | base64 -D > ~/Library/MobileDevice/Provisioning\ Profiles/senicare.mobileprovision

          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.senicare.app $IOS_PROVISIONING_PROFILE_NAME" ios/ExportOptions.plist

      - name: Get Flutter Dependencies & CocoaPods
        run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Build Signed iOS IPA
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
        if: env.IOS_DIST_CERT_BASE64 != ''
        run: |
          flutter build ipa --release \
            --obfuscate --split-debug-info=build/symbols/ios \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=STRIPE_PUBLISHABLE_KEY="${{ secrets.STRIPE_PUBLISHABLE_KEY }}" \
            --dart-define=FIREBASE_IOS_API_KEY="${{ secrets.FIREBASE_IOS_API_KEY }}" \
            --dart-define=FIREBASE_IOS_APP_ID="${{ secrets.FIREBASE_IOS_APP_ID }}"

      - name: Upload iOS IPA & Obfuscation Debug Symbols
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
        if: env.IOS_DIST_CERT_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-release
          path: |
            build/ios/ipa/*.ipa
            build/symbols/ios

      - name: Upload IPA to App Store Connect (TestFlight)
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        if: startsWith(github.ref, 'refs/tags/v') && env.API_KEY_ID != '' && env.API_ISSUER_ID != '' && env.API_PRIVATE_KEY != ''
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app \
            -f build/ios/ipa/*.ipa \
            --type ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"
