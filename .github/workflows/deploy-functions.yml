name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'functions/**'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Dependencies Cleanly
        run: npm ci
        working-directory: functions

      - name: Syntax & Automated Financial Test Gate
        run: |
          node --check index.js
          npm test
        working-directory: functions

      - name: Deploy to Firebase Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@13.31.1 deploy --only functions --non-interactive
          rm -f "$RUNNER_TEMP/firebase-sa.json"
