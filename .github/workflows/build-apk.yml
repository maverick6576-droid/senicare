name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Create .env file for assets
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi
          if [ -n "${{ secrets.STRIPE_PUBLISHABLE_KEY }}" ]; then echo "STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}" >> .env; fi
          if [ -n "${{ secrets.FIREBASE_API_KEY }}" ]; then echo "FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env; fi
          if [ -n "${{ secrets.ADMIN_EMAILS }}" ]; then echo "ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}" >> .env; fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze and run tests
        run: |
          flutter analyze --no-pub
          flutter test --no-pub --no-test-assets --reporter=expanded

      - name: Decode Android Keystore (if configured)
        env:
          SENICARE_KEYSTORE_BASE64: ${{ secrets.SENICARE_KEYSTORE_BASE64 }}
          SENICARE_KEYSTORE_PASSWORD: ${{ secrets.SENICARE_KEYSTORE_PASSWORD }}
          SENICARE_KEY_ALIAS: ${{ secrets.SENICARE_KEY_ALIAS }}
          SENICARE_KEY_PASSWORD: ${{ secrets.SENICARE_KEY_PASSWORD }}
        if: env.SENICARE_KEYSTORE_BASE64 != ''
        run: |
          echo "$SENICARE_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "SENICARE_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/upload-keystore.jks" >> $GITHUB_ENV
          echo "SENICARE_KEYSTORE_PASSWORD=$SENICARE_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "SENICARE_KEY_ALIAS=$SENICARE_KEY_ALIAS" >> $GITHUB_ENV
          echo "SENICARE_KEY_PASSWORD=$SENICARE_KEY_PASSWORD" >> $GITHUB_ENV

      - name: Build APK & Play Store App Bundle (AAB)
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_ANDROID_API_KEY="${{ secrets.FIREBASE_ANDROID_API_KEY }}" \
            --dart-define=FIREBASE_ANDROID_APP_ID="${{ secrets.FIREBASE_ANDROID_APP_ID }}"
          flutter build appbundle --release \
            --dart-define=FIREBASE_ANDROID_API_KEY="${{ secrets.FIREBASE_ANDROID_API_KEY }}" \
            --dart-define=FIREBASE_ANDROID_APP_ID="${{ secrets.FIREBASE_ANDROID_APP_ID }}"

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
