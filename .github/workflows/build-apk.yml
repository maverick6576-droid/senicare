name: Build & Publish Android Release (AAB & APK)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Validate Stripe Publishable Key on Release Tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          STRIPE_PK: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          if [[ "$STRIPE_PK" != pk_live_* ]]; then
            echo "::error::Production tag build requires a live Stripe publishable key (pk_live_*)."
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        run: flutter analyze --no-pub

      - name: Run Unit & Widget Tests
        id: run_tests
        run: |
          set -o pipefail
          flutter test --no-pub --reporter=expanded 2>&1 | tee test_output.log

      - name: Report Failures
        if: always()
        run: |
          python3 -c "
          try:
              with open('test_output.log', 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()
              for i, line in enumerate(lines):
                  if '══╡ EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK' in line:
                      start = max(0, i - 5)
                      end = min(len(lines), i + 35)
                      snippet = ' -- '.join([l.strip() for l in lines[start:end] if l.strip()])
                      print(f'::error title=FailureDetail::{snippet[:600]}')
                  if ' [E]' in line or '(failed)' in line:
                      print(f'::error title=FailedTest::{line.strip()}')
          except Exception as e:
              print(f'::error::Failed to parse test log: {e}')
          "

      - name: Publish Test Summary
        if: always()
        run: |
          if [ -f test_output.log ]; then
            echo "### Test Execution Results" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -B 3 -A 15 -E '(failed|EXCEPTION|Error:|Expected:|Actual:|══╡ EXCEPTION)' test_output.log | tail -n 200 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Output Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-log
          path: test_output.log

      - name: Decode Android Keystore
        env:
          SENICARE_KEYSTORE_BASE64: ${{ secrets.SENICARE_KEYSTORE_BASE64 }}
          SENICARE_KEYSTORE_PASSWORD: ${{ secrets.SENICARE_KEYSTORE_PASSWORD }}
          SENICARE_KEY_ALIAS: ${{ secrets.SENICARE_KEY_ALIAS }}
          SENICARE_KEY_PASSWORD: ${{ secrets.SENICARE_KEY_PASSWORD }}
        if: env.SENICARE_KEYSTORE_BASE64 != ''
        run: |
          echo "$SENICARE_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "SENICARE_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/upload-keystore.jks" >> $GITHUB_ENV
          echo "SENICARE_KEYSTORE_PASSWORD=$SENICARE_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "SENICARE_KEY_ALIAS=$SENICARE_KEY_ALIAS" >> $GITHUB_ENV
          echo "SENICARE_KEY_PASSWORD=$SENICARE_KEY_PASSWORD" >> $GITHUB_ENV

      - name: Build Signed Play Store App Bundle (AAB) & APK
        env:
          SENICARE_KEYSTORE_BASE64: ${{ secrets.SENICARE_KEYSTORE_BASE64 }}
        if: env.SENICARE_KEYSTORE_BASE64 != ''
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols/android \
            --dart-define=STRIPE_PUBLISHABLE_KEY="${{ secrets.STRIPE_PUBLISHABLE_KEY }}" \
            --dart-define=FIREBASE_ANDROID_API_KEY="${{ secrets.FIREBASE_ANDROID_API_KEY }}" \
            --dart-define=FIREBASE_ANDROID_APP_ID="${{ secrets.FIREBASE_ANDROID_APP_ID }}"
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols/android \
            --dart-define=STRIPE_PUBLISHABLE_KEY="${{ secrets.STRIPE_PUBLISHABLE_KEY }}" \
            --dart-define=FIREBASE_ANDROID_API_KEY="${{ secrets.FIREBASE_ANDROID_API_KEY }}" \
            --dart-define=FIREBASE_ANDROID_APP_ID="${{ secrets.FIREBASE_ANDROID_APP_ID }}"

      - name: Upload AAB & APK Artifacts
        env:
          SENICARE_KEYSTORE_BASE64: ${{ secrets.SENICARE_KEYSTORE_BASE64 }}
        if: env.SENICARE_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-app-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Obfuscation Debug Symbols
        env:
          SENICARE_KEYSTORE_BASE64: ${{ secrets.SENICARE_KEYSTORE_BASE64 }}
        if: env.SENICARE_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-symbols
          path: build/symbols/android

      - name: Publish to Google Play Internal Track
        env:
          GOOGLE_PLAY_SA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        if: startsWith(github.ref, 'refs/tags/v') && env.GOOGLE_PLAY_SA != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.senicare.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
