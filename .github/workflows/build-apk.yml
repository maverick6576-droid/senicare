name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Create .env file for assets
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi
          if [ -n "${{ secrets.STRIPE_PUBLISHABLE_KEY }}" ]; then echo "STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}" >> .env; fi
          if [ -n "${{ secrets.FIREBASE_API_KEY }}" ]; then echo "FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env; fi
          if [ -n "${{ secrets.ADMIN_EMAILS }}" ]; then echo "ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}" >> .env; fi

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        run: flutter analyze --no-pub

      - name: Run Unit & Widget Tests
        id: run_tests
        run: |
          set -o pipefail
          flutter test --no-pub --no-test-assets --reporter=expanded 2>&1 | tee test_output.log

      - name: Report Failures
        if: always()
        run: |
          python3 -c "
          import re
          try:
              with open('test_output.log', 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              matches = re.findall(r'(══╡ EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK ╞═[\s\S]*?════════════════════════════════════════════════════════════════════════════════════════════════════)', content)
              for idx, m in enumerate(matches[:10]):
                  summary = ' -- '.join([l.strip() for l in m.split('\n')[1:6] if l.strip()])
                  print(f'::error title=Failure_{idx+1}::{summary}')
              failed_tests = re.findall(r'(\d+:\d+ \+\d+ -\d+: .*)', content)
              for t in failed_tests[:15]:
                  print(f'::error title=TestFailed::{t}')
          except Exception as e:
              print(f'::error::Failed to parse test log: {e}')
          "

      - name: Publish Test Summary
        if: always()
        run: |
          if [ -f test_output.log ]; then
            echo "### Test Execution Results" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -B 3 -A 15 -E '(failed|EXCEPTION|Error:|Expected:|Actual:|══╡ EXCEPTION)' test_output.log | tail -n 200 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Output Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-log
          path: test_output.log

      - name: Decode Android Keystore (if configured)
        env:
          SENICARE_KEYSTORE_BASE64: ${{ secrets.SENICARE_KEYSTORE_BASE64 }}
          SENICARE_KEYSTORE_PASSWORD: ${{ secrets.SENICARE_KEYSTORE_PASSWORD }}
          SENICARE_KEY_ALIAS: ${{ secrets.SENICARE_KEY_ALIAS }}
          SENICARE_KEY_PASSWORD: ${{ secrets.SENICARE_KEY_PASSWORD }}
        if: env.SENICARE_KEYSTORE_BASE64 != ''
        run: |
          echo "$SENICARE_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "SENICARE_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/upload-keystore.jks" >> $GITHUB_ENV
          echo "SENICARE_KEYSTORE_PASSWORD=$SENICARE_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "SENICARE_KEY_ALIAS=$SENICARE_KEY_ALIAS" >> $GITHUB_ENV
          echo "SENICARE_KEY_PASSWORD=$SENICARE_KEY_PASSWORD" >> $GITHUB_ENV

      - name: Build APK & Play Store App Bundle (AAB)
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_ANDROID_API_KEY="${{ secrets.FIREBASE_ANDROID_API_KEY }}" \
            --dart-define=FIREBASE_ANDROID_APP_ID="${{ secrets.FIREBASE_ANDROID_APP_ID }}"
          flutter build appbundle --release \
            --dart-define=FIREBASE_ANDROID_API_KEY="${{ secrets.FIREBASE_ANDROID_API_KEY }}" \
            --dart-define=FIREBASE_ANDROID_APP_ID="${{ secrets.FIREBASE_ANDROID_APP_ID }}"

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
